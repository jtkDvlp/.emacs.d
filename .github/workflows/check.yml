name: Check

on:
  push:
  pull_request:

jobs:
  check:
    # NOTE: macOS because the configuration only targets macOS and has
    # `system-type' branches for it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: 31.1

      - name: Load and byte-compile the configuration
        # NOTE: The step takes 2.5 to 3.5 minutes.  Three runs hung for
        # hours while packages were downloaded: git never gives up on a
        # stalled transfer.  One below 1 KB/s for 60 s now fails the
        # package instead, git fails rather than wait for a password,
        # scripts/check gives up after 8 minutes and names the packages
        # it still waited for, and the time limit catches the rest.
        timeout-minutes: 15
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
          GIT_TERMINAL_PROMPT: 0
        run: scripts/check --report "$GITHUB_STEP_SUMMARY" --verify-lock
